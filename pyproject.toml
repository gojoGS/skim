[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sklm-cli"
version = "0.2.0"
description = "Skills manager for AI agents"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["skills", "ai-agent", "cli"]

authors = [
    {name = "Auran0s"},
]

dependencies = [
    "typer>=0.12.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "questionary>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
sklm = "sklm.cli.main:run"

[tool.setuptools.packages.find]
include = ["sklm*"]

[tool.setuptools.package-data]
sklm = ["agents/agents.yaml"]
